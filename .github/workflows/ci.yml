name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Syntax check & smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python3 -m py_compile server.py && echo "Syntax OK"

      - name: VERSION file matches __version__
        run: |
          file_version="$(tr -d '[:space:]' < VERSION)"
          code_version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' server.py)"
          echo "VERSION=$file_version  __version__=$code_version"
          test "$file_version" = "$code_version"

      - name: Smoke test, server starts and answers /healthz
        run: |
          # Minimal config: plain HTTP, sign-in off, throwaway database.
          cat > /tmp/ci-config.json <<'EOF'
          {"host": "127.0.0.1", "port": 18080, "tls": false,
           "environments": [{"id": "robin", "name": "Robin", "url": "https://example.com"}]}
          EOF
          export RESERVE_CONFIG=/tmp/ci-config.json
          export RESERVE_DB=/tmp/ci-data/reservations.db

          python3 server.py &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          # Wait up to 15 s for the server to be ready
          for i in $(seq 1 15); do
            sleep 1
            curl -sf http://127.0.0.1:18080/healthz > /tmp/healthz.json 2>/dev/null && break
          done

          cat /tmp/healthz.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/healthz.json"))
          assert d.get("ok") is True, "healthz ok is not true"
          print("healthz OK, version", d.get("version"))
          EOF
